<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VC route Insights — 최신 글</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root {
    --brand: #3858E9;
    --ink: #1E1E1E;
    --muted: #6B7280;
    --line: #E7E7E9;
    --bg: #FFFFFF;
    --soft: #F7F7F8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }

  .widget {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    max-width: 100%;
  }
  .widget-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .widget-head .title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }
  .widget-head .mark {
    width: 24px; height: 24px;
    background: var(--brand);
    color: #fff;
    border-radius: 5px;
    display: grid; place-items: center;
    font-size: 10px;
    font-weight: 800;
  }
  .widget-head a {
    font-size: 12px;
    font-weight: 600;
    color: var(--brand);
  }
  .widget-head a::after { content: " →"; }

  .post-list { display: grid; gap: 16px; }
  .post-item {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 16px;
    align-items: center;
    padding: 8px 0;
    transition: opacity .2s;
  }
  .post-item:hover { opacity: 0.7; }
  .post-item .thumb {
    width: 80px;
    aspect-ratio: 1/1;
    border-radius: 6px;
    overflow: hidden;
    background: var(--soft);
  }
  .post-item .thumb img,
  .post-item .thumb svg {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .post-item .body { min-width: 0; }
  .post-item .cat {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--brand);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .post-item h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .post-item .date {
    font-size: 11px;
    color: var(--muted);
  }

  .skel {
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: shim 1.4s infinite;
    border-radius: 4px;
  }
  @keyframes shim { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body>

<!-- =========================================================
  VC route Insights — Embeddable Widget
  vcroute.com에서 iframe으로 임베드:
  <iframe src="https://blog.vcroute.com/embed.html"
          width="100%" height="480"
          style="border:0;" loading="lazy"></iframe>
  쿼리 파라미터:
  ?count=4         (표시할 글 개수, 기본 4)
  ?theme=light|dark
========================================================== -->

<div class="widget" id="widget">
  <div class="widget-head">
    <div class="title">
      <span class="mark">VC</span>
      <span>VC route Insights</span>
    </div>
    <a href="https://blog.vcroute.com" target="_blank" rel="noopener">전체 보기</a>
  </div>
  <div class="post-list" id="post-list"></div>
</div>

<script src="/assets/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const count  = parseInt(params.get("count") || "4", 10);

  function renderWidget(posts) {
    const list = document.getElementById("post-list");
    list.innerHTML = posts.slice(0, count).map((p, i) => {
      const thumb = p.thumbnail_url
        ? `<img src="${p.thumbnail_url}" alt="${p.subject}" />`
        : PLACEHOLDER_SVGS[i % PLACEHOLDER_SVGS.length];
      const cat = p.category_name || "인사이트";
      return `
        <a class="post-item" href="https://blog.vcroute.com/post.html?id=${encodeURIComponent(p.idx || p.id || '')}" target="_blank" rel="noopener">
          <div class="thumb">${thumb}</div>
          <div class="body">
            <div class="cat">${cat}</div>
            <h4>${p.subject}</h4>
            <div class="date">${formatDate(p.create_date) || '최근 업데이트'}</div>
          </div>
        </a>`;
    }).join("");

    // 부모 페이지에 높이 전송 (iframe auto-resize)
    if (window.parent !== window) {
      const h = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: "vcroute-widget-height", height: h }, "*");
    }
  }

  function showSkeletons() {
    const list = document.getElementById("post-list");
    list.innerHTML = Array(count).fill(`
      <div class="post-item">
        <div class="skel" style="width:80px;height:80px;"></div>
        <div>
          <div class="skel" style="width:30%;height:10px;margin-bottom:8px"></div>
          <div class="skel" style="width:90%;height:14px;margin-bottom:6px"></div>
          <div class="skel" style="width:60%;height:14px;margin-bottom:8px"></div>
          <div class="skel" style="width:40%;height:11px"></div>
        </div>
      </div>
    `).join("");
  }

  (async () => {
    showSkeletons();
    let posts = MOCK_POSTS;
    try {
      const result = await fetchPosts({ limit: count });
      if (result?.list?.length) posts = result.list;
    } catch {}
    renderWidget(posts);
  })();
</script>
</body>
</html>
